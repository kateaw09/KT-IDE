[package]
name = "kt-robotics-ide"
version = "0.1.0"
description = "Offline Arduino C Robotics IDE & 4x8 Field Simulator"
authors = ["KT-Robotics"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.5.1"
zip = "2.2.0"
walkdir = "2.5.0"
regex = "1.11.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
